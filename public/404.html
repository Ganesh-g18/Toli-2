<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Toli Motors</title>
    <script>
      // SPA redirect for GitHub Pages
      var repo = "/Toli-2/";
      var path = window.location.pathname;
      if (path.indexOf(repo) === 0) {
        path = path.substring(repo.length);
      }
      var redirect = repo + "#" + encodeURIComponent(path + window.location.search);
      window.location.replace(redirect);
    </script>
  </head>
  <body></body>
</html>
